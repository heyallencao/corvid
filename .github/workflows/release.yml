name: Corvid Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json (0.x.x)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: corvid-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requested = process.env.REQUESTED_VERSION;
          if (!/^0\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(requested)) throw new Error(`Expected a semantic 0.x.x version, got ${requested}`);
          if (pkg.version !== requested) throw new Error(`package.json is ${pkg.version}, requested ${requested}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${requested}\n`);
          NODE
          tag="v${REQUESTED_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists" >&2
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Full Electron regression (macOS arm64 release gate)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: env -u ELECTRON_RUN_AS_NODE npm test
      - name: Build and smoke test macOS app bundle
        if: matrix.platform == 'mac'
        env:
          CORVID_PACKAGED_ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run package:mac:dir
            npm run test:packaged:mac
          else
            npm run package:mac:dir:x64
            npm run test:packaged:mac:x64
          fi
      - name: Build macOS DMG and ZIP
        if: matrix.platform == 'mac'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then npm run package:mac:release; else npm run package:mac:release:x64; fi
      - name: Build and smoke test Windows installer
        if: matrix.platform == 'win'
        run: |
          npm run package:win:release
          npm run test:packaged:win
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: corvid-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/Corvid-*.dmg
            dist/Corvid-*.zip
            dist/Corvid-*.exe

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: corvid-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and create checksum manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          shopt -s nullglob
          assets=(release-assets/Corvid-*.dmg release-assets/Corvid-*.zip release-assets/Corvid-*.exe)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "Expected exactly two macOS DMGs, two macOS ZIPs, and one Windows installer; found ${#assets[@]} assets" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          (
            cd release-assets
            files=(Corvid-*.dmg Corvid-*.zip Corvid-*.exe)
            shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          )
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = fs.readdirSync('release-assets');
          for (const suffix of ['-mac-arm64.dmg', '-mac-arm64.zip', '-mac-x64.dmg', '-mac-x64.zip', '-win-x64.exe']) {
            if (!files.some(name => name.startsWith(`Corvid-${process.env.VERSION}`) && name.endsWith(suffix))) {
              throw new Error(`Missing release asset matching *${suffix}`);
            }
          }
          NODE
      - name: Create the private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" docs/records/releases/release-notes-template.md > release-assets/RELEASE_NOTES.md
          printf '\nBuilt from main commit `%s`.\n' "$GITHUB_SHA" >> release-assets/RELEASE_NOTES.md
          gh release create "v${VERSION}" release-assets/Corvid-*.dmg release-assets/Corvid-*.zip release-assets/Corvid-*.exe release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Corvid v${VERSION}" \
            --notes-file release-assets/RELEASE_NOTES.md
