name: Issue 16 Agent 面板最小宽度回归

on:
  pull_request:
    paths:
      - desktop/main.cjs
      - desktop/styles.css
      - desktop/index.html
      - tests/agent-rooms-panel-e2e.cjs
      - .github/workflows/issue16-agent-panel-layout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-panel-layout:
    name: macOS Agent 面板布局
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 运行 Agent 空间面板真实 Electron 回归
        run: env -u ELECTRON_RUN_AS_NODE node tests/agent-rooms-panel-e2e.cjs
        env:
          CORVID_AGENT_PANEL_LAYOUT_SCREENSHOT_PATH: ${{ runner.temp }}/issue16-agent-panel-719px.png
      - name: 上传隔离窄窗截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue16-agent-panel-719px
          path: ${{ runner.temp }}/issue16-agent-panel-719px.png
          if-no-files-found: ignore
