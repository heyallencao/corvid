name: 凭据系统存储集成（手动）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-safe-storage:
    name: ${{ matrix.os }} 系统凭据存储
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 验证 Windows DPAPI 存储
        if: runner.os == 'Windows'
        shell: bash
        run: node tests/pi-credential-os-store-e2e.cjs

      - name: 验证 macOS Keychain 存储
        if: runner.os == 'macOS'
        shell: bash
        run: node tests/pi-credential-os-store-e2e.cjs
