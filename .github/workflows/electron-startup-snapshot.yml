name: Electron 启动进程快照跨平台合同

on:
  pull_request:
    paths:
      - 'desktop/startup-progress.cjs'
      - 'tests/electron-startup.e2e.mjs'
      - 'tests/electron-test-startup.cjs'
      - '.github/workflows/electron-startup-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-snapshot:
    name: ${{ matrix.os }} 进程快照
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 验证操作系统进程快照合同
        run: node --test --test-name-pattern="启动失败在清理前记录操作系统进程快照且不包含命令行" tests/electron-startup.e2e.mjs
