name: Chrome 导入类别隔离跨平台验收

on:
  pull_request:
    paths:
      - 'desktop/chrome-import.cjs'
      - 'desktop/index.html'
      - 'desktop/locales.js'
      - 'desktop/main.cjs'
      - 'desktop/renderer.js'
      - 'desktop/styles.css'
      - 'tests/chrome-import-e2e.cjs'
      - 'tests/chrome-import-categories.test.mjs'
      - '.github/workflows/chrome-import-platform.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-import-categories:
    name: ${{ matrix.os }} Chrome 导入类别隔离
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
          - ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 配置 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0 xvfb

      - name: 验证 Linux 合成资料导入
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            eval "$(printf "%s" "corvid-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets --daemonize)"
            export XDG_CURRENT_DESKTOP=GNOME
            export CORVID_TEST_CATEGORY_ISOLATION_ONLY=1
            node tests/chrome-import-e2e.cjs
          '

      - name: 验证 macOS 与 Windows 合成资料导入
        if: runner.os != 'Linux'
        shell: bash
        run: CORVID_TEST_CATEGORY_ISOLATION_ONLY=1 node tests/chrome-import-e2e.cjs
