<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Corvid</title><style>
* {box-sizing:border-box} :root {color-scheme:light;--chrome:#f1f3f6;--line:#d9dee7;--text:#202633;--muted:#687386;--accent:#3468c9;--hover:#e5e9f0} body {margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:var(--text)} button,select,input {font:inherit;color:inherit} #rooms,#tabs,#nav {display:flex;align-items:center;gap:5px;padding:4px 12px;white-space:nowrap} #rooms {height:36px;background:var(--chrome);overflow:visible;position:relative;z-index:22} #room-strip {height:100%;display:flex;align-items:center;gap:3px;overflow:auto;flex:1;min-width:0} #room-actions {display:flex;align-items:center;gap:2px;flex:none} #profile-menu,#room-menu {position:absolute;z-index:50;top:31px;min-width:190px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002} #profile-menu {left:12px} #room-menu {right:12px} #profile-menu[hidden],#room-menu[hidden] {display:none} #profile-menu button,#room-menu button {display:block;width:100%;text-align:left;padding:9px 11px} #rooms select {max-width:130px;border:1px solid #d7dce4;border-radius:7px;background:#fff;padding:5px 8px} #rooms .menu-trigger {width:24px;height:28px;font-size:13px} #room-strip button {height:28px;border-radius:6px} #room-strip button.selected {background:#fff;box-shadow:0 1px 3px #0002} #tabs {height:38px;background:#e8ebf0;overflow:auto;gap:3px} #chrome-tools {height:40px;display:flex;align-items:center;gap:4px;padding:3px 10px;background:#fff;border-bottom:1px solid var(--line)} #chrome-tools #address-form {display:flex;flex:1;min-width:100px;margin:0 8px} #chrome-tools #address {width:100%;flex:1} #chrome-tools #nav {display:contents} button {border:0;border-radius:7px;background:transparent;padding:6px 9px;cursor:pointer;color:inherit} button:hover {background:var(--hover)} button.selected {background:white;box-shadow:0 1px 4px #0002} .icon-button {width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:16px;color:#4e596a;flex:none} #nav {height:46px;background:#fff;gap:5px;padding:5px 12px} #nav form {display:flex;flex:1;min-width:100px} #address {width:100%;border:1px solid #d7dce4;border-radius:22px;background:#f4f6f8;padding:9px 16px;min-width:100px;height:36px;outline:none;transition:box-shadow .15s,border-color .15s,background .15s} #address:focus {background:#fff;border-color:#9bb6ec;box-shadow:0 0 0 3px #3468c91c} input:not(#address) {border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:100px} #status {color:var(--muted);display:flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;padding:0 12px;background:#fff} #status:empty {display:none}
/* Visual system: quiet graphite chrome with one restrained indigo accent. */
:root {color-scheme:light;--chrome:#f6f7f9;--line:#e2e5ea;--text:#252a34;--muted:#747d8b;--accent:#5367d8;--hover:#edf0f5;--chrome-raised:#fff;--tab:#e9ecf1}
body {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;letter-spacing:.005em;color:var(--text)}
#rooms {padding:4px 14px;background:#f7f8fa;border-bottom:1px solid #e8eaee;gap:6px}
#profile-select {height:28px;min-width:116px;font-weight:600!important;color:#333b49!important}
#rooms .menu-trigger {border-radius:6px;color:#7a8391}
#room-strip {padding-left:8px;border-left:1px solid #e1e4e9}
#room-strip button {padding:5px 10px;color:#687180;font-weight:500}
#room-strip button.selected {color:#303a57;background:#e9ecfb;box-shadow:none}
#tabs {height:40px;padding:4px 12px 0;background:#f7f8fa;gap:4px}
#tabs .tab {height:35px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:#596272;box-shadow:none}
#tabs .tab[aria-selected="true"] {background:#fff;border-color:#e2e5ea;color:#252a34}
#tabs .tab:hover {background:#eef0f4}
#tabs .tab[aria-selected="true"]:hover {background:#fff}
#chrome-tools {height:48px;padding:6px 14px;gap:6px;background:#fff;border-bottom:1px solid #e7e9ed}
#chrome-tools #address-form {margin:0 6px}
#address {height:34px;padding:7px 15px;border-color:#e5e7ec;background:#f5f6f8;font-size:13px}
#address:hover {background:#f0f2f5}
#address:focus {background:#fff;border-color:#aab4ee;box-shadow:0 0 0 3px #5367d818}
.icon-button {width:30px;height:30px;border-radius:8px;font-size:15px;color:#687180}
.icon-button:hover {background:#f0f2f5;color:#343d4c}
#bookmark-current {font-size:18px}
#bookmarks-bar {height:34px;padding:2px 14px;gap:3px;background:#fff;border-bottom:1px solid #eceef1}
#bookmarks-bar button {height:27px;padding:4px 9px;border-radius:6px;color:#596272;font-size:12px}
#bookmarks-bar button:hover {background:#f1f3f6}
#status {min-height:30px;padding:4px 14px;background:#fbf7e9;color:#755d24;border-bottom:1px solid #eee4c8}
#site-tools,#profile-menu,#room-menu,#tab-menu {border:1px solid #e1e4e9;border-radius:10px;box-shadow:0 12px 32px #202b3d1a;padding:5px;background:#fff}
#site-tools button,#profile-menu button,#room-menu button,#tab-menu button {border-radius:6px;padding:8px 10px}
#findbar {top:12px;right:20px;padding:7px;border:1px solid #e0e4eb;border-radius:11px;background:#fff;box-shadow:0 8px 28px #202b3d1c}
#find-input {height:32px;border-color:#e3e6eb}
#library {border:1px solid #e3e6eb;border-radius:12px;box-shadow:0 12px 36px #202b3d18}
dialog {border:1px solid #e1e4e9;border-radius:14px;box-shadow:0 18px 60px #17203330}
button {transition:background-color .12s ease,color .12s ease}
 #status button {font-size:12px;color:var(--accent);padding:3px 7px} #site-tools {position:absolute;z-index:30;right:12px;top:122px;min-width:190px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002} #site-tools[hidden] {display:none} #site-tools button {display:block;width:100%;text-align:left;padding:9px 11px} #bookmarks-bar {height:34px;display:flex;align-items:center;gap:4px;padding:2px 12px;background:#fff;border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap} #bookmarks-bar:empty {display:none} .bookmark-item {display:inline-flex;align-items:center;gap:6px;max-width:190px;padding:5px 8px;border-radius:7px;color:#4c5666;text-decoration:none;cursor:pointer} .bookmark-item:hover {background:var(--hover)} .bookmark-item img {width:14px;height:14px;object-fit:contain} .bookmark-item span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #library {height:240px;overflow:auto;background:#fff;border-top:1px solid var(--line);padding:8px 16px} #library[hidden] {display:none} #library header {display:flex;align-items:center;gap:8px} #library h2 {font-size:14px;flex:1;margin:4px 0} .entry {display:flex;align-items:center;gap:8px;border-top:1px solid #eee} .entry a {display:block;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#245cb3;cursor:pointer;padding:7px 0} dialog {position:fixed;top:125px;bottom:auto;margin:0 auto;border:0;border-radius:12px;box-shadow:0 12px 40px #0004} dialog form {display:flex;gap:8px;align-items:center} dialog::backdrop {background:#0005} #tabs {gap:2px} .tab {display:flex;align-items:center;gap:0;height:28px;border-radius:7px;max-width:230px;min-width:64px;cursor:default;user-select:none} .tab[aria-selected="true"] {background:#fff;box-shadow:0 1px 4px #0002} .tab:hover {background:#e1e6ee} .tab[aria-selected="true"]:hover {background:#fff} .tab-main {display:flex;align-items:center;gap:6px;height:100%;flex:1;min-width:0;padding:0 2px 0 8px;border-radius:7px 0 0 7px;overflow:hidden} .tab-main:hover {background:transparent} .tab .favicon {width:14px;height:14px;flex:none;border-radius:3px;object-fit:contain} .tab-title {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px} .tab-close {opacity:0;padding:0 4px;line-height:1.2;border-radius:5px;font-size:14px;margin-right:3px} .tab:hover .tab-close,.tab[aria-selected="true"] .tab-close {opacity:1} .tab-close:hover {background:#cfd6e2} .tab.dragging {opacity:.55} .tab.drop-before {box-shadow:inset 2px 0 0 #3b6fd4} .tab.drop-after {box-shadow:inset -2px 0 0 #3b6fd4} .tab.pinned {border:1px solid #cfd6e2;background:#e9edf4} .tab.pinned[aria-selected="true"] {background:#fff} .tab .pin-icon {width:12px;height:12px;flex:none} #tab-menu {position:fixed;z-index:60;min-width:170px;background:#fff;border:1px solid #d6dbe3;border-radius:8px;box-shadow:0 10px 30px #0003;padding:4px;display:flex;flex-direction:column;gap:2px} #tab-menu[hidden] {display:none} #tab-menu .menu-item {text-align:left;padding:6px 10px;border-radius:6px} #tab-menu .menu-item:focus-visible,#tab-menu .menu-item:hover {background:#e7eaf0} #tab-menu .menu-separator {height:1px;background:#e2e6ec;margin:3px 6px} body.tab-dragging {cursor:grabbing} #findbar {position:fixed;top:118px;right:16px;z-index:40;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d6dbe3;border-radius:8px;box-shadow:0 8px 24px #0003;padding:6px 8px} #findbar[hidden] {display:none} #findbar input {width:200px;flex:none;padding:4px 6px} #find-count {color:#627085;font-size:12px;min-width:42px;text-align:right} #findbar button {padding:2px 7px;border-radius:5px}  #findbar {top:124px;right:18px;z-index:25;box-shadow:0 8px 28px #0002;border:1px solid var(--line);border-radius:12px;padding:7px;background:#fff} #findbar input {width:260px} #tab-menu {z-index:40} #rooms button {flex:none} #rooms select {border:1px solid #d7dce4;border-radius:7px;background:#fff;padding:5px 8px} #chrome-tools #address-form {margin:0 8px} #bookmark-current {font-size:20px;color:#596579} #bookmark-current:hover {color:#c58b00} #bookmarks-bar {scrollbar-width:thin} #status:not(:empty) {min-height:30px;border-top:1px solid #edf0f3;font-size:12px} #library {height:260px} #library-search {flex:0 1 320px} #library-items {padding:4px 0} .entry:hover {background:#f8f9fb} .entry a {text-decoration:none} .entry a:hover {text-decoration:underline} @media (max-width:800px) {#chrome-tools {gap:1px;padding-inline:6px}.icon-button {width:29px} #status {max-width:160px} .bookmark-item {max-width:130px}}
</style></head><body>
<div id="rooms"><select id="profile-select" aria-label="Profile"></select><button id="profile-menu-trigger" class="icon-button menu-trigger" aria-label="Profile 选项" title="Profile 选项" aria-expanded="false">▾</button><div id="room-strip"></div><button id="room-menu-trigger" class="icon-button menu-trigger" aria-label="Room 选项" title="Room 选项" aria-expanded="false">⋯</button><div id="room-actions"></div><div id="profile-menu" role="menu" aria-label="Profile 选项" hidden></div><div id="room-menu" role="menu" aria-label="Room 选项" hidden></div></div><div id="tabs"></div><div id="chrome-tools"><button class="icon-button" data-action="back" aria-label="后退" title="后退">‹</button><button class="icon-button" data-action="forward" aria-label="前进" title="前进">›</button><button class="icon-button" data-action="reload" aria-label="重新加载" title="重新加载">⟳</button><form id="address-form"><input id="address" aria-label="地址或搜索" placeholder="搜索或输入网址"></form><button id="bookmark-current" class="icon-button" title="将此页加入书签" aria-label="将此页加入书签">☆</button><button id="show-bookmarks" class="icon-button" title="书签" aria-label="书签">▤</button><button id="show-history" class="icon-button" title="历史记录" aria-label="历史记录">◷</button><button id="show-downloads" class="icon-button" title="下载" aria-label="下载">⇩</button><button id="show-settings" class="icon-button" title="设置" aria-label="设置">⚙</button><button id="more-tools" class="icon-button" title="站点工具" aria-label="站点工具" aria-expanded="false">⋯</button></div><div id="bookmarks-bar" aria-label="书签栏"></div><div id="status" role="status"></div>
<div id="findbar" hidden role="search"><input id="find-input" aria-label="页内查找" placeholder="在页面中查找"><span id="find-count" role="status"></span><button id="find-prev" aria-label="上一个匹配">↑</button><button id="find-next" aria-label="下一个匹配">↓</button><button id="find-close" aria-label="关闭查找">×</button></div>
<div id="site-tools" role="menu" aria-label="站点工具" hidden><button id="clear-site" role="menuitem">清理此站点数据</button><button id="site-permissions" role="menuitem">管理站点权限</button></div>
<div id="tab-menu" role="menu" aria-label="标签页操作" hidden></div>
<section id="library" hidden><header><h2 id="library-title"></h2><input id="library-search" type="search" aria-label="搜索列表" placeholder="搜索标题、网址或文件名"><button id="close-library">关闭</button></header><div id="library-items"></div></section>
<dialog id="new-room"><form id="new-room-form"><label>Room 名称 <input id="room-name" required></label><button type="submit">创建</button><button type="button" id="cancel-room">取消</button></form></dialog>
<dialog id="new-profile"><form id="new-profile-form"><label>Profile 名称 <input id="profile-name" required></label><button type="submit">创建 Profile</button><button type="button" id="cancel-profile">取消</button></form></dialog>
<dialog id="rename-profile"><form id="rename-profile-form"><label>新 Profile 名称 <input id="renamed-profile-name" required></label><span id="rename-profile-error" role="alert"></span><button type="submit">保存名称</button><button type="button" id="cancel-rename-profile">取消</button></form></dialog>
<dialog id="settings"><form id="settings-form"><label>搜索引擎 <select id="search-preset"><option value="https://www.google.com/search?q={query}">Google</option><option value="https://www.bing.com/search?q={query}">Bing</option><option value="https://duckduckgo.com/?q={query}">DuckDuckGo</option><option value="custom">自定义</option></select></label><label>搜索模板 <input id="search-template" required></label><span id="settings-error" role="alert"></span><button type="submit">保存设置</button><button type="button" id="cancel-settings">取消</button></form></dialog>
<dialog id="page-dialog"><form id="page-dialog-form"><span id="page-dialog-message"></span><label id="page-dialog-prompt-label">回复 <input id="page-dialog-prompt"></label><button type="submit">确定</button><button type="button" id="page-dialog-dismiss">取消</button></form></dialog>
<script src="renderer.js"></script></body></html>
