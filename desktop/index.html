<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Corvid</title><style>
* {box-sizing:border-box} body {margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f5f7;color:#202633} #rooms,#tabs,#nav {display:flex;align-items:center;gap:5px;padding:4px 10px;height:35px;overflow:auto;white-space:nowrap} #rooms {padding-left:80px;background:#e7eaf0} #tabs {background:#edf0f4} button {border:0;border-radius:6px;background:transparent;padding:5px 9px;cursor:pointer;color:inherit} button:hover {background:#dce2eb} button.selected {background:white;box-shadow:0 1px 4px #0002} #nav {height:42px;background:#fff} input {flex:1;border:1px solid #d6dbe3;border-radius:7px;padding:7px 10px;min-width:100px} #status {color:#627085} #library {height:240px;overflow:auto;background:#fff;border-top:1px solid #ddd;padding:8px 16px} #library[hidden] {display:none} #library header {display:flex;align-items:center;gap:8px} #library h2 {font-size:14px;flex:1;margin:4px 0} .entry {display:flex;align-items:center;gap:8px;border-top:1px solid #eee} .entry a {display:block;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#245cb3;cursor:pointer;padding:7px 0} dialog {position:fixed;top:125px;bottom:auto;margin:0 auto;border:0;border-radius:10px;box-shadow:0 12px 40px #0004} dialog form {display:flex;gap:8px;align-items:center} dialog::backdrop {background:#0005} #tabs {gap:2px} .tab {display:flex;align-items:center;gap:0;height:28px;border-radius:7px;max-width:230px;min-width:64px;cursor:default;user-select:none} .tab[aria-selected="true"] {background:#fff;box-shadow:0 1px 4px #0002} .tab:hover {background:#e1e6ee} .tab[aria-selected="true"]:hover {background:#fff} .tab-main {display:flex;align-items:center;gap:6px;height:100%;flex:1;min-width:0;padding:0 2px 0 8px;border-radius:7px 0 0 7px;overflow:hidden} .tab-main:hover {background:transparent} .tab .favicon {width:14px;height:14px;flex:none;border-radius:3px;object-fit:contain} .tab-title {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px} .tab-close {opacity:0;padding:0 4px;line-height:1.2;border-radius:5px;font-size:14px;margin-right:3px} .tab:hover .tab-close,.tab[aria-selected="true"] .tab-close {opacity:1} .tab-close:hover {background:#cfd6e2} .tab.dragging {opacity:.55} .tab.drop-before {box-shadow:inset 2px 0 0 #3b6fd4} .tab.drop-after {box-shadow:inset -2px 0 0 #3b6fd4} body.tab-dragging {cursor:grabbing} #findbar {position:fixed;top:118px;right:16px;z-index:40;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d6dbe3;border-radius:8px;box-shadow:0 8px 24px #0003;padding:6px 8px} #findbar[hidden] {display:none} #findbar input {width:200px;flex:none;padding:4px 6px} #find-count {color:#627085;font-size:12px;min-width:42px;text-align:right} #findbar button {padding:2px 7px;border-radius:5px} </style></head><body>
<div id="rooms"></div><div id="tabs"></div><div id="nav"><button data-action="back" aria-label="后退">←</button><button data-action="forward" aria-label="前进">→</button><button data-action="reload" aria-label="刷新">⟳</button><form id="address-form" style="display:flex;flex:1"><input id="address" aria-label="地址" placeholder="输入网址或搜索"></form><button id="bookmark-current" title="收藏当前页面" aria-label="收藏当前页面">☆</button><button id="show-bookmarks">书签</button><button id="show-history">历史</button><button id="show-downloads">下载</button><button id="show-settings">设置</button><button id="clear-site">站点数据</button><button id="site-permissions">站点权限</button><span id="status"></span></div>
<div id="findbar" hidden role="search"><input id="find-input" aria-label="页内查找" placeholder="在页面中查找"><span id="find-count" role="status"></span><button id="find-prev" aria-label="上一个匹配">↑</button><button id="find-next" aria-label="下一个匹配">↓</button><button id="find-close" aria-label="关闭查找">×</button></div>
<section id="library" hidden><header><h2 id="library-title"></h2><input id="library-search" type="search" aria-label="搜索列表" placeholder="搜索标题、网址或文件名"><button id="close-library">关闭</button></header><div id="library-items"></div></section>
<dialog id="new-room"><form id="new-room-form"><label>Room 名称 <input id="room-name" required></label><button type="submit">创建</button><button type="button" id="cancel-room">取消</button></form></dialog>
<dialog id="new-profile"><form id="new-profile-form"><label>Profile 名称 <input id="profile-name" required></label><button type="submit">创建 Profile</button><button type="button" id="cancel-profile">取消</button></form></dialog>
<dialog id="rename-profile"><form id="rename-profile-form"><label>新 Profile 名称 <input id="renamed-profile-name" required></label><span id="rename-profile-error" role="alert"></span><button type="submit">保存名称</button><button type="button" id="cancel-rename-profile">取消</button></form></dialog>
<dialog id="settings"><form id="settings-form"><label>搜索引擎 <select id="search-preset"><option value="https://www.google.com/search?q={query}">Google</option><option value="https://www.bing.com/search?q={query}">Bing</option><option value="https://duckduckgo.com/?q={query}">DuckDuckGo</option><option value="custom">自定义</option></select></label><label>搜索模板 <input id="search-template" required></label><span id="settings-error" role="alert"></span><button type="submit">保存设置</button><button type="button" id="cancel-settings">取消</button></form></dialog>
<dialog id="page-dialog"><form id="page-dialog-form"><span id="page-dialog-message"></span><label id="page-dialog-prompt-label">回复 <input id="page-dialog-prompt"></label><button type="submit">确定</button><button type="button" id="page-dialog-dismiss">取消</button></form></dialog>
<script src="renderer.js"></script></body></html>
